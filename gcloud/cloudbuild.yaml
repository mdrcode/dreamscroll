# Build the image with an immutable tag.
#
# Typical manual submit:
# (bash/zsh):
# gcloud beta builds submit --config gcloud/cloudbuild.yaml --substitutions=_IMAGE_TAG=$(git rev-parse --short HEAD) --machine-type=e2-highcpu-32 .
# (fish):
# gcloud beta builds submit --config gcloud/cloudbuild.yaml --substitutions=_IMAGE_TAG=(git rev-parse --short HEAD) --machine-type=e2-highcpu-32  .
#
substitutions:
  _LOCATION: 'us-central1'
  _REPOSITORY: 'dreamscroll-repo'
  _IMAGE_NAME: 'dreamscroll-web'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform'
      - 'linux/amd64'
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}'
      - '.'

images:
  - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}'