# Build the image with an immutable tag.
#
# Typical manual submit:
# (bash/zsh):
# gcloud beta builds submit --config gcloud/cloudbuild.yaml --substitutions=_IMAGE_TAG=$(git rev-parse HEAD) .
# (fish):
# gcloud beta builds submit --config gcloud/cloudbuild.yaml --substitutions=_IMAGE_TAG=(git rev-parse HEAD) .
#
# Override the build machine type (default E2_HIGHCPU_32) with the CLI flag,
# e.g. --machine-type=E2_HIGHCPU_8
#
substitutions:
  _LOCATION: 'us-central1'
  _REPOSITORY: 'dreamscroll-repo'
  _IMAGE_NAME: 'dreamscroll-web'
  _CLOUD_RUN_SERVICE: 'dreamscroll-webui-api'

steps:
  # 1. Build image with the immutable tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform'
      - 'linux/amd64'
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}'
      - '.'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}'

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_CLOUD_RUN_SERVICE}'
      - '--image'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}'
      - '--region'
      - '${_LOCATION}'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_32'