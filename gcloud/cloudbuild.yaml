# Build the image with an immutable tag.
#
# Typical manual submit:
# (bash/zsh):
# gcloud beta builds submit --config gcloud/cloudbuild.yaml --substitutions=_IMAGE_TAG=$(git rev-parse HEAD) .
# (fish):
# gcloud beta builds submit --config gcloud/cloudbuild.yaml --substitutions=_IMAGE_TAG=(git rev-parse HEAD) .
#
# Override the build machine type (default E2_HIGHCPU_32) by adding it to the
# substitutions, e.g. --substitutions=_IMAGE_TAG=abc1234,_MACHINE_TYPE=E2_HIGHCPU_32
#
substitutions:
  _LOCATION: 'us-central1'
  _REPOSITORY: 'dreamscroll-repo'
  _IMAGE_NAME: 'dreamscroll-web'
  _MACHINE_TYPE: 'E2_HIGHCPU_32'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform'
      - 'linux/amd64'
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}'
      - '.'

images:
  - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: '${_MACHINE_TYPE}'